/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:15px/1.45 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.display{font-family:'Bricolage Grotesque',-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent-ring);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-tint)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ============ Estructura ============ */
#app{min-height:100dvh;display:flex;flex-direction:column}
#topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.wordmark{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em}
.wordmark .clara{color:var(--accent)}
#topbar .sp{flex:1}
.chip-streak{
  display:none;align-items:center;gap:5px;
  font-size:12.5px;font-weight:600;color:var(--ink2);
  background:var(--surface2);border:1px solid var(--border);
  padding:4px 10px;border-radius:999px;
}
.chip-streak.on{display:inline-flex}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:12px;color:var(--ink2);
}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:21px;height:21px}

#layout{flex:1;display:flex;min-height:0}
#sidebar{display:none}
main#view{
  flex:1;min-width:0;
  padding:14px max(16px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  max-width:640px;margin:0 auto;width:100%;
}

/* Tab bar inferior */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  padding:6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:12px;color:var(--muted);
  font-size:10.5px;font-weight:600;letter-spacing:.02em;
}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.tab:active{transform:scale(.96)}
#fab{
  position:fixed;z-index:45;
  left:50%;margin-left:-30px;
  bottom:calc(30px + env(safe-area-inset-bottom));
  width:60px;height:60px;border-radius:20px;
  background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
  transition:transform .15s ease;
  user-select:none;-webkit-user-select:none;
}
#fab svg{width:28px;height:28px}
#fab:active{transform:scale(.93)}

/* Escritorio */
@media (min-width:920px){
  #topbar{display:none}
  #layout{max-width:1180px;margin:0 auto;width:100%;gap:24px;padding:0 24px}
  #sidebar{
    display:flex;flex-direction:column;gap:4px;
    width:224px;flex:none;position:sticky;top:0;height:100dvh;
    padding:28px 0;
  }
  #sidebar .wordmark{font-size:22px;padding:0 14px;margin-bottom:18px}
  .navlink{
    display:flex;align-items:center;gap:11px;
    padding:10px 14px;border-radius:12px;
    color:var(--ink2);font-weight:600;font-size:14.5px;
  }
  .navlink svg{width:20px;height:20px}
  .navlink:hover{background:var(--surface2)}
  .navlink.on{background:var(--accent-tint);color:var(--accent)}
  #sidebar .newbtn{
    margin:16px 8px 0;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:var(--on-accent);
    padding:12px;border-radius:14px;font-weight:700;font-size:14.5px;
  }
  #sidebar .newbtn svg{width:18px;height:18px}
  #sidebar .sp{flex:1}
  #sidebar .side-streak{padding:0 14px;font-size:12.5px;color:var(--muted);font-weight:600}
  main#view{max-width:none;padding:28px 0 60px}
  #tabbar,#fab{display:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .grid2 > .span2{grid-column:1/-1}
}
@media (max-width:919.9px){ .grid2 > *{margin-bottom:12px} .grid2 > *:last-child{margin-bottom:0} }

/* ============ Tarjetas / genéricos ============ */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
}
.card + .card{margin-top:12px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.card-head .sp{flex:1}
.card-sub{font-size:12.5px;color:var(--muted)}
.view-title{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:23px;letter-spacing:-.02em;text-wrap:balance;margin:6px 0 14px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.hr{height:1px;background:var(--border);margin:12px 0;border:0}
.hidden{display:none!important}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 16px;border-radius:12px;
  font-weight:700;font-size:14px;
  background:var(--accent);color:var(--on-accent);
  transition:transform .12s ease,opacity .12s ease;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.subtle{background:none;color:var(--accent);padding:8px 10px}
.btn.danger{background:none;color:var(--crit-text);border:1px solid var(--border)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:17px;height:17px}

.linkbtn{color:var(--accent);font-weight:700;font-size:13.5px}

/* Segmentado */
.seg{
  display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;
}
.seg button{
  flex:1;padding:8px 10px;border-radius:9px;
  font-size:13.5px;font-weight:700;color:var(--muted);
  transition:background .15s ease,color .15s ease;
}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg button.on.g{color:var(--gas)}
.seg button.on.i{color:var(--ing)}

/* Chips */
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:999px;
  background:var(--surface2);border:1px solid transparent;
  font-size:13px;font-weight:600;color:var(--ink2);
  white-space:nowrap;
}
.chip.on{background:var(--accent-tint);color:var(--accent);border-color:var(--accent-ring)}
.chip svg{width:15px;height:15px}
.chiprow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chiprow::-webkit-scrollbar{display:none}

/* Badges */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:700;letter-spacing:.02em;
  padding:2.5px 8px;border-radius:999px;
  background:var(--surface2);color:var(--muted);
}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--on-warn)}
:root[data-theme="dark"] .badge.warn{color:#ffd77a}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .badge.warn{color:#ffd77a}}
.badge.crit{background:color-mix(in srgb,var(--crit) 14%,var(--surface));color:var(--crit-text)}
.badge.acc{background:var(--accent-tint);color:var(--accent)}

/* ============ Héroe / KPIs ============ */
.hero{padding:20px 16px 18px}
.hero .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.hero .val{font-size:clamp(38px,9vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
.hero .sub{margin-top:6px;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(min-width:920px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .lbl{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .delta{font-size:12px;font-weight:700;margin-top:3px;display:flex;align-items:center;gap:3px}
.kpi .delta.up{color:var(--good)}
.kpi .delta.down{color:var(--crit-text)}
.kpi .delta.flat{color:var(--muted)}

/* Alertas */
.alerts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.alert{
  display:flex;align-items:center;gap:10px;
  border-radius:13px;padding:11px 13px;font-size:13.5px;font-weight:600;
  border:1px solid var(--border);background:var(--surface);
}
.alert .ic{font-size:16px;line-height:1}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--border))}
.alert.crit{border-color:color-mix(in srgb,var(--crit) 45%,var(--border))}
.alert .txt{flex:1;color:var(--ink2)}
.alert b{color:var(--ink)}

/* ============ Listas de movimientos ============ */
.dayhead{
  display:flex;align-items:baseline;gap:8px;
  margin:16px 2px 7px;font-size:12.5px;font-weight:700;color:var(--muted);
  letter-spacing:.03em;text-transform:uppercase;
}
.dayhead .tot{margin-left:auto;font-weight:700;color:var(--ink2);text-transform:none;letter-spacing:0}
.mov{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:11px 13px;margin-bottom:7px;
  transition:transform .12s ease;
}
.mov:active{transform:scale(.985)}
.mov .emo{
  width:40px;height:40px;border-radius:13px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:19px;
  background:color-mix(in srgb,var(--catc,#888) 16%,var(--surface));
}
.mov .mid{flex:1;min-width:0}
.mov .t1{font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:6px}
.mov .t1 .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mov .amt{font-weight:700;font-size:15px;white-space:nowrap}
.mov .amt.i{color:var(--good)}
.mov .amt.t{color:var(--muted)}

/* ============ Meters (presupuesto / metas) ============ */
.meter{
  --mc:var(--accent);
  height:10px;border-radius:999px;overflow:hidden;
  background:color-mix(in srgb,var(--mc) 16%,var(--surface));
  position:relative;
}
.meter > i{
  display:block;height:100%;border-radius:999px;
  background:var(--mc);
  width:var(--w,0%);
  transition:width .5s cubic-bezier(.3,.7,.3,1);
}
.brow{padding:11px 2px}
.brow .top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.brow .top .emo{font-size:16px}
.brow .top .nm{font-weight:650;font-size:14px}
.brow .top .st{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--muted)}
.brow .bot{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:var(--muted)}
.brow + .brow{border-top:1px solid var(--border)}

/* ============ Gráficas ============ */
.chart-wrap{position:relative}
.chart-wrap svg{width:100%;height:auto}
.chart-wrap .bar,.chart-wrap .seg-arc,.chart-wrap .hm-cell,.chart-wrap .hbar{cursor:pointer}
.axis{font-size:10.5px;fill:var(--muted)}
.axis.num{font-variant-numeric:tabular-nums}
.gridline{stroke:var(--grid);stroke-width:1}
.baseline{stroke:var(--grid);stroke-width:1}
.dlab{font-size:11px;font-weight:700;fill:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.lg{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);font-weight:600}
.lg .sw{width:10px;height:10px;border-radius:3px;background:var(--lc)}
.lg .ln{width:14px;height:3px;border-radius:2px;background:var(--lc)}
.leyenda-cat{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.lcat{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 6px;border-radius:10px;font-size:13.5px;
}
.lcat:hover{background:var(--surface2)}
.lcat .sw{width:10px;height:10px;border-radius:3px;flex:none}
.lcat .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);font-weight:600}
.lcat .pc{color:var(--muted);font-size:12px;width:38px;text-align:right}
.lcat .mt{font-weight:700}
.donut-c{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.donut-c .donut-svg{flex:1 1 150px;max-width:190px;margin:0 auto}
.donut-c .leyenda-cat{flex:1 1 220px;margin-top:0}
.dc-lbl{font-size:11.5px;fill:var(--muted);font-weight:600}
.dc-val{font-size:17px;font-weight:700;fill:var(--ink);letter-spacing:-.01em}

/* tooltip */
#tip{
  position:fixed;z-index:80;pointer-events:none;
  background:color-mix(in srgb,var(--ink) 94%,transparent);
  color:var(--bg);
  border-radius:10px;padding:8px 11px;
  font-size:12.5px;line-height:1.5;
  box-shadow:var(--shadow);
  opacity:0;transform:translateY(4px);
  transition:opacity .12s ease,transform .12s ease;
  max-width:240px;
}
#tip.on{opacity:1;transform:none}
#tip .t-t{font-weight:600;opacity:.75;font-size:11.5px;margin-bottom:2px}
#tip .t-r{display:flex;align-items:center;gap:7px;white-space:nowrap}
#tip .t-r .k{width:12px;height:3px;border-radius:2px;flex:none}
#tip .t-r .v{font-weight:750;font-variant-numeric:tabular-nums}
#tip .t-r .l{opacity:.8}

/* tabla accesible */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{
  text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);font-weight:700;padding:7px 8px;border-bottom:1px solid var(--grid);
}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--border);color:var(--ink2)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl-scroll{overflow-x:auto}

/* ============ Sheet (registro) ============ */
#backdrop{
  position:fixed;inset:0;z-index:60;background:rgba(8,8,6,.44);
  opacity:0;pointer-events:none;transition:opacity .22s ease;
}
#backdrop.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  background:var(--surface);
  border-radius:22px 22px 0 0;
  box-shadow:var(--sheet-shadow);
  transform:translateY(102%);
  transition:transform .26s cubic-bezier(.32,.72,.28,1);
  max-height:94dvh;
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
#sheet.on{transform:none}
#sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--surface3);margin:9px auto 2px;flex:none}
#sheet .sh-head{display:flex;align-items:center;gap:8px;padding:6px 16px 4px;flex:none}
#sheet .sh-title{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:17px}
#sheet .sh-body{overflow-y:auto;padding:4px 16px 16px;min-height:0}
@media(min-width:920px){
  #sheet{
    left:50%;right:auto;bottom:auto;top:50%;
    transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;
    width:min(760px,92vw);border-radius:22px;max-height:88vh;
    transition:transform .2s ease,opacity .2s ease;
  }
  #sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
}

/* monto grande */
.amount{
  text-align:center;padding:6px 0 2px;
  font-size:clamp(36px,11vw,46px);font-weight:700;letter-spacing:-.02em;
  line-height:1.15;min-height:1.2em;
  font-variant-numeric:tabular-nums;
}
.amount .cur{font-size:.5em;font-weight:600;color:var(--muted);margin-right:4px;vertical-align:.12em}
.amount.expr{font-size:clamp(26px,8vw,34px)}
.amount .op{color:var(--accent);font-weight:600;margin:0 3px}
.amount-hint{text-align:center;font-size:12px;color:var(--muted);min-height:16px;font-weight:600}

/* fila de opciones del sheet */
.optrow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:8px 2px 4px}
.optrow::-webkit-scrollbar{display:none}
.notewrap{padding:6px 2px}
.notewrap input,.field input,.field select{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:10px 13px;font-size:14.5px;color:var(--ink);
}
.notewrap input::placeholder{color:var(--muted)}

/* grilla de categorías */
.catgrid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:7px;
  padding:8px 2px 10px;
}
@media(min-width:920px){.catgrid{grid-template-columns:repeat(5,1fr)}}
.catbtn{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  min-width:0;
  padding:10px 4px 8px;border-radius:14px;
  background:var(--surface2);border:1.5px solid transparent;
  transition:transform .12s ease,border-color .15s ease,background .15s ease;
}
.catbtn:active{transform:scale(.93)}
.catbtn .em{
  width:38px;height:38px;border-radius:12px;font-size:19px;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--catc,#888) 17%,var(--surface));
}
.catbtn .nm{font-size:11px;font-weight:650;color:var(--ink2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catbtn.sel{border-color:var(--catc);background:color-mix(in srgb,var(--catc) 10%,var(--surface))}

/* teclado */
.keypad{
  display:grid;grid-template-columns:repeat(4,1fr);gap:7px;
  padding:4px 2px 10px;flex:none;
}
.key{
  height:52px;border-radius:14px;
  background:var(--surface2);
  font-size:21px;font-weight:650;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s ease,background .12s ease;
  font-variant-numeric:tabular-nums;
  user-select:none;-webkit-user-select:none;
}
.key:active{transform:scale(.92);background:var(--surface3)}
.key.op{color:var(--accent);font-size:19px;background:var(--accent-tint)}
.key svg{width:22px;height:22px}
.key.ok{background:var(--accent);color:var(--on-accent)}
.sh-cols{display:flex;flex-direction:column}
@media(max-width:919.9px){
  .sh-cols .catgrid{max-height:248px;overflow-y:auto;overscroll-behavior:contain}
}
@media(min-width:920px){
  .sh-cols{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
  .sh-cols .catgrid{max-height:340px;overflow-y:auto}
  .key{height:56px}
}

/* check de guardado */
#savefx{
  position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  pointer-events:none;
}
#savefx.on{display:flex}
#savefx .disc{
  width:86px;height:86px;border-radius:50%;
  background:var(--accent);display:flex;align-items:center;justify-content:center;
  animation:pop .5s cubic-bezier(.3,1.4,.4,1) both;
  box-shadow:var(--shadow);
}
#savefx svg{width:44px;height:44px;stroke:var(--on-accent)}
#savefx svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .32s .12s ease-out forwards}
@keyframes pop{from{transform:scale(.5);opacity:0}60%{transform:scale(1.06);opacity:1}to{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}

/* ============ Snackbar / toast ============ */
#snackwrap{
  position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));
  z-index:75;display:flex;flex-direction:column;align-items:center;gap:8px;
  pointer-events:none;padding:0 16px;
}
@media(min-width:920px){#snackwrap{bottom:28px}}
.snack{
  pointer-events:auto;
  display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--ink) 94%,transparent);color:var(--bg);
  border-radius:13px;padding:11px 16px;
  font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);
  animation:snackin .25s cubic-bezier(.3,.9,.3,1) both;
  max-width:min(480px,100%);
}
.snack button{color:#7fd8bd;font-weight:800;font-size:13.5px;letter-spacing:.02em}
@media (prefers-color-scheme:dark){ :root:where(:not([data-theme="light"])) .snack button{color:#0a5c49} }
:root[data-theme="dark"] .snack button{color:#0a5c49}
.snack.bye{animation:snackout .2s ease forwards}
@keyframes snackin{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes snackout{to{transform:translateY(10px);opacity:0}}

/* ============ Vacíos / onboarding ============ */
.empty{
  text-align:center;padding:34px 18px;color:var(--muted);
}
.empty .em{font-size:34px;margin-bottom:8px}
.empty .t{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:16.5px;color:var(--ink2);margin-bottom:4px;text-wrap:balance}
.empty .s{font-size:13.5px;max-width:300px;margin:0 auto 14px;text-wrap:balance}

#onboard{
  position:fixed;inset:0;z-index:90;background:var(--bg);
  display:none;align-items:center;justify-content:center;padding:24px;
}
#onboard.on{display:flex}
.ob-card{max-width:430px;width:100%;text-align:center}
.ob-card .logo{
  width:74px;height:74px;border-radius:24px;background:var(--accent);
  color:var(--on-accent);font-size:36px;display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;box-shadow:var(--shadow);
}
.ob-card h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:29px;letter-spacing:-.02em;text-wrap:balance}
.ob-card .tag{color:var(--ink2);font-size:15px;margin:8px 0 22px;text-wrap:balance}
.ob-card .q{font-weight:700;font-size:13px;color:var(--ink2);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase}
.curgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.curbtn{
  padding:9px 14px;border-radius:12px;font-weight:700;font-size:14px;
  background:var(--surface);border:1.5px solid var(--border);color:var(--ink2);
}
.curbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
.ob-more{margin-bottom:20px}
.ob-more select{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 12px;font-size:14px}

/* ============ Ajustes ============ */
.setrow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 2px;border-bottom:1px solid var(--border);
}
.setrow:last-child{border-bottom:0}
.setrow .ic{font-size:18px;width:26px;text-align:center;flex:none}
.setrow .mid{flex:1;min-width:0}
.setrow .t{display:block;font-weight:650;font-size:14.5px}
.setrow .s{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.setrow select{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font-size:13.5px;max-width:170px}
.setrow .chev{color:var(--muted);flex:none}

/* switch */
.tgl{
  position:relative;width:46px;height:28px;border-radius:999px;flex:none;
  background:var(--surface3);transition:background .18s ease;
}
.tgl::after{
  content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25);
  transition:transform .18s ease;
}
.tgl.on{background:var(--accent)}
.tgl.on::after{transform:translateX(18px)}

/* metas */

.metacard .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.metacard .top .em{font-size:22px}
.metacard .nm{font-weight:700;font-size:15.5px;font-family:'Bricolage Grotesque',system-ui,sans-serif}
.metacard .st{font-size:12px;color:var(--muted)}
.metacard .nums{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 4px;font-size:12.5px;color:var(--muted)}

}

@keyframes viewin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

<script>
(()=>{ 'use strict';

/* ============================================================
   Cuentas Claras — motor de datos
   Dinero: enteros en centavos. Fechas: 'YYYY-MM-DD' local.
   ============================================================ */

const $  = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id'+Date.now()+Math.random().toString(36).slice(2,8));

/* ---------- Monedas ---------- */
const CURRENCIES = [
  ['USD','Dólar estadounidense','en-US'], ['EUR','Euro','es-ES'], ['MXN','Peso mexicano','es-MX'],
  ['COP','Peso colombiano','es-CO'], ['ARS','Peso argentino','es-AR'], ['CLP','Peso chileno','es-CL'],
  ['PEN','Sol peruano','es-PE'], ['VES','Bolívar venezolano','es-VE'], ['BOB','Boliviano','es-BO'],
  ['UYU','Peso uruguayo','es-UY'], ['PYG','Guaraní paraguayo','es-PY'], ['GTQ','Quetzal guatemalteco','es-GT'],
  ['HNL','Lempira hondureño','es-HN'], ['NIO','Córdoba nicaragüense','es-NI'], ['CRC','Colón costarricense','es-CR'],
  ['PAB','Balboa panameño','es-PA'], ['DOP','Peso dominicano','es-DO'], ['BRL','Real brasileño','pt-BR'],
  ['GBP','Libra esterlina','en-GB'], ['CAD','Dólar canadiense','en-CA'],
];
const curLocale = c => (CURRENCIES.find(x=>x[0]===c)||[,,'es'])[2];

let _fmt=null,_fmtKey='';
function moneyFmt(){
  const k = DB.settings.currency;
  if(_fmtKey!==k){ _fmt = new Intl.NumberFormat(curLocale(k), {style:'currency', currency:k}); _fmtKey=k; }
  return _fmt;
}
const curDecimals = ()=> moneyFmt().resolvedOptions().maximumFractionDigits;
function fmtMoney(cents, {sign=false}={}){
  const v = cents/100;
  const s = moneyFmt().format(Math.abs(v));
  if(sign) return (cents<0?'−':'+') + s;
  return cents<0 ? '−'+s : s;
}
function decSep(){ return new Intl.NumberFormat(curLocale(DB.settings.currency)).format(1.1).replace(/\d/g,''); }
function milSep(){ return new Intl.NumberFormat(curLocale(DB.settings.currency)).format(1000).replace(/\d/g,'') || '.'; }
function fmtCompact(cents){
  const v = Math.abs(cents/100); const neg = cents<0?'−':'';
  const d = decSep();
  const f = (n)=>{ const s=(Math.round(n*10)/10).toFixed(1).replace('.',d); return s.endsWith(d+'0')?s.slice(0,-2):s; };
  if(v>=1e6) return neg+f(v/1e6)+' M';
  if(v>=1e4) return neg+f(v/1e3)+' k';
  return neg+new Intl.NumberFormat(curLocale(DB.settings.currency),{maximumFractionDigits:0}).format(v);
}
/* número plano para CSV (coma o punto según locale, sin agrupar) */
function plainNum(cents){
  const dd = 2;
  let s = (cents/100).toFixed(dd);
  if(decSep()===',') s = s.replace('.',',');
  return s;
}

/* ---------- Fechas (siempre locales) ---------- */
const p2 = n => String(n).padStart(2,'0');
const dateKey = d => `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const parseKey = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const monthOf = k => k.slice(0,7);
const thisMonth = () => todayKey().slice(0,7);
const daysInMonth = ym => { const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); };
const addMonths = (ym,n) => { const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${p2(d.getMonth()+1)}`; };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_AB = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS_AB = ['dom','lun','mar','mié','jue','vie','sáb'];
function monthLabel(ym,short=false){ const [y,m]=ym.split('-').map(Number); const name = short?MESES_AB[m-1]:MESES[m-1]; const yy = (y===new Date().getFullYear()&&!short)?'':' '+(short?String(y).slice(2):y); return short? name+(y===new Date().getFullYear()?'':' '+String(y).slice(2)) : name.charAt(0).toUpperCase()+name.slice(1)+yy; }
function dayLabel(k){
  const t=todayKey();
  if(k===t) return 'Hoy';
  const y=new Date(); y.setDate(y.getDate()-1);
  if(k===dateKey(y)) return 'Ayer';
  const d=parseKey(k);
  return `${DIAS_AB[d.getDay()]} ${d.getDate()} ${MESES_AB[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''}`;
}
function shortDate(k){ const d=parseKey(k); return `${d.getDate()} ${MESES_AB[d.getMonth()]}`; }

/* ---------- Categorías por defecto ---------- */
/* color = índice de --c0..--c12 ; grupo: nec/des/aho (gasto) · base/aho/excl (ingreso) */
const DEFAULT_CATS = [
  {id:'c_super', nombre:'Supermercado',  emoji:'🛒', color:2,  tipo:'g', grupo:'nec'},
  {id:'c_rest',  nombre:'Restaurantes',  emoji:'🍔', color:1,  tipo:'g', grupo:'des'},
  {id:'c_trans', nombre:'Transporte',    emoji:'🚌', color:6,  tipo:'g', grupo:'nec'},
  {id:'c_hogar', nombre:'Hogar',         emoji:'🏠', color:0,  tipo:'g', grupo:'nec'},
  {id:'c_serv',  nombre:'Servicios',     emoji:'💡', color:3,  tipo:'g', grupo:'nec'},
  {id:'c_subs',  nombre:'Suscripciones', emoji:'📱', color:8,  tipo:'g', grupo:'des'},
  {id:'c_salud', nombre:'Salud',         emoji:'💊', color:7,  tipo:'g', grupo:'nec'},
  {id:'c_edu',   nombre:'Educación',     emoji:'🎓', color:9,  tipo:'g', grupo:'nec'},
  {id:'c_ocio',  nombre:'Ocio',          emoji:'🎬', color:4,  tipo:'g', grupo:'des'},
  {id:'c_ropa',  nombre:'Ropa',          emoji:'👕', color:11, tipo:'g', grupo:'des'},
  {id:'c_regalo',nombre:'Regalos',       emoji:'🎁', color:10, tipo:'g', grupo:'des'},
  {id:'c_ahorro',nombre:'Ahorro e inversión', emoji:'💰', color:5, tipo:'g', grupo:'aho'},
  {id:'c_otros', nombre:'Otros',         emoji:'📦', color:-1, tipo:'g', grupo:'des', fija:true},
  {id:'i_sal',   nombre:'Salario',       emoji:'💼', color:2,  tipo:'i', grupo:'base'},
  {id:'i_free',  nombre:'Freelance y negocio', emoji:'💻', color:0, tipo:'i', grupo:'base'},
  {id:'i_bono',  nombre:'Bono',          emoji:'🎉', color:3,  tipo:'i', grupo:'base'},
  {id:'i_inv',   nombre:'Rendimientos',  emoji:'🏦', color:5,  tipo:'i', grupo:'aho'},
  {id:'i_reg',   nombre:'Regalo recibido', emoji:'🎁', color:10, tipo:'i', grupo:'base'},
  {id:'i_reemb', nombre:'Reembolso y otros', emoji:'💸', color:-1, tipo:'i', grupo:'excl', fija:true},
];
const catColorVar = c => c.color<0 ? 'var(--cx)' : `var(--c${c.color})`;

/* ---------- Estado ---------- */
const LS_KEY = 'cuentas-claras-v1';
let DB = null;
let storageOK = true;

function freshDB(){
  return {
    v:1,
    settings:{ currency:null, theme:'auto', onboarded:false, lastAccount:'a_efec', lastExport:null, budgetsTouched:false, celebradas:[] },
    accounts:[ {id:'a_efec', nombre:'Efectivo', emoji:'💵', saldoInicial:0, archivada:false} ],
    cats: DEFAULT_CATS.map(c=>({...c})),
    tx:[],
    budgets:{},           /* {'YYYY-MM': {catId:cents}} */
    metas:[],             /* {id,nombre,emoji,objetivo,fechaLimite,creado,demo} */
    fijos:[],             /* {id,tipo,monto,cat,cuenta,dia,nota,activo,nextDue,demo} */
    usage:{},             /* catId -> veces usada (para ordenar la grilla) */
  };
}
function loadDB(){
  let raw=null;
  try{
    raw = localStorage.getItem(LS_KEY);
    localStorage.setItem('cc-probe','1'); localStorage.removeItem('cc-probe');
  }catch(e){ storageOK = false; }
  if(raw){
    try{ DB = migrate(JSON.parse(raw)); }
    catch(e){
      DB = freshDB();
      try{ localStorage.setItem(LS_KEY+'-rescate', raw); }catch(_){}
      setTimeout(()=>snack('Tus datos guardados estaban dañados; se guardó una copia de rescate.', null, null, 8000), 600);
    }
  }
  DB = DB || freshDB();
}
function migrate(db){
  /* Sanea TODO lo que entra (localStorage o respaldo importado): ids, emojis,
     montos, fechas y referencias. Es la única frontera de confianza. */
  const base = freshDB();
  const sid = v => String(v??'').replace(/[^\w.-]/g,'').slice(0,40);
  const stx = (v,n) => String(v??'').replace(/[<>&"'`=]/g,'').slice(0,n);  /* solo para lo que se pinta crudo (emoji) */
  const txt = (v,n) => String(v??'').slice(0,n);                            /* nombres y notas: esc() al renderizar */
  const fecha = v => /^\d{4}-\d{2}-\d{2}$/.test(String(v||'')) ? String(v) : null;
  const cents = v => { const n=Math.round(+v); return Number.isFinite(n)? n : 0; };
  db = (db && typeof db==='object') ? db : {};
  db.settings = {...base.settings, ...(db.settings||{})};
  if(!Array.isArray(db.settings.celebradas)) db.settings.celebradas=[];
  if(!(typeof db.settings.currency==='string' && CURRENCIES.some(c=>c[0]===db.settings.currency))) db.settings.currency=null;
  db.settings.theme = ['auto','light','dark'].includes(db.settings.theme)? db.settings.theme : 'auto';
  for(const k of ['accounts','cats','tx','metas','fijos']) if(!Array.isArray(db[k])) db[k]=[];
  db.accounts = db.accounts.filter(a=>a&&typeof a==='object').map(a=>({
    id:sid(a.id)||uid(), nombre:txt(a.nombre,24)||'Cuenta', emoji:stx(a.emoji,8)||'💵',
    saldoInicial:cents(a.saldoInicial), archivada:!!a.archivada }));
  if(!db.accounts.length) db.accounts.push({id:'a_efec', nombre:'Efectivo', emoji:'💵', saldoInicial:0, archivada:false});
  db.cats = db.cats.filter(c=>c&&typeof c==='object').map(c=>({
    id:sid(c.id)||uid(), nombre:txt(c.nombre,26)||'Categoría', emoji:stx(c.emoji,8)||'🏷️',
    color:(Number.isInteger(c.color)&&c.color>=0&&c.color<=11)? c.color : -1,
    tipo:c.tipo==='i'?'i':'g', grupo:['nec','des','aho','base','excl'].includes(c.grupo)? c.grupo : (c.tipo==='i'?'base':'des'),
    fija:!!c.fija, archivada:!!c.archivada }));
  for(const dc of DEFAULT_CATS) if(!db.cats.some(c=>c.id===dc.id)) db.cats.push({...dc});
  const accIds = new Set(db.accounts.map(a=>a.id));
  const catIds = new Set(db.cats.map(c=>c.id));
  db.tx = db.tx.filter(x=>x&&typeof x==='object').map(x=>({
    id:sid(x.id)||uid(), tipo:['g','i','t'].includes(x.tipo)? x.tipo:'g',
    monto:Math.abs(cents(x.monto)), fecha:fecha(x.fecha),
    cat: x.cat==null? null : sid(x.cat),
    cuenta:sid(x.cuenta), cuentaDestino: x.cuentaDestino!=null? sid(x.cuentaDestino):undefined,
    nota:txt(x.nota,140), creado:Number.isFinite(+x.creado)? +x.creado : 0,
    metaId: x.metaId!=null? sid(x.metaId):undefined, fijoId: x.fijoId!=null? sid(x.fijoId):undefined,
    demo: x.demo? true:undefined,
  })).filter(x=> x.monto>0 && x.fecha
    && (x.tipo!=='t' || (accIds.has(x.cuenta) && accIds.has(x.cuentaDestino) && x.cuenta!==x.cuentaDestino)));
  for(const x of db.tx){
    if(!accIds.has(x.cuenta)) x.cuenta = db.accounts[0].id;
    if(x.tipo==='t') x.cat=null;
    else if(x.cat==null || !catIds.has(x.cat)) x.cat = x.tipo==='g'?'c_otros':'i_reemb';
  }
  db.tx.sort((a,b)=> a.fecha===b.fecha ? ((a.creado||0)-(b.creado||0)) : (a.fecha<b.fecha?-1:1));
  db.metas = db.metas.filter(m=>m&&typeof m==='object'&&cents(m.objetivo)>0).map(m=>({
    id:sid(m.id)||uid(), nombre:txt(m.nombre,30)||'Meta', emoji:stx(m.emoji,8)||'🎯',
    objetivo:cents(m.objetivo), fechaLimite:fecha(m.fechaLimite), creado:Number.isFinite(+m.creado)? +m.creado : Date.now(),
    demo:m.demo?true:undefined }));
  db.fijos = db.fijos.filter(f=>f&&typeof f==='object'&&cents(f.monto)>0).map(f=>({
    id:sid(f.id)||uid(), tipo:f.tipo==='i'?'i':'g', monto:cents(f.monto),
    cat: catIds.has(sid(f.cat))? sid(f.cat) : 'c_otros',
    cuenta: accIds.has(sid(f.cuenta))? sid(f.cuenta) : db.accounts[0].id,
    dia:Math.min(31,Math.max(1,Math.round(+f.dia)||1)), nota:txt(f.nota,40),
    activo:f.activo!==false, nextDue:fecha(f.nextDue), demo:f.demo?true:undefined }));
  const bClean={};
  if(db.budgets && typeof db.budgets==='object' && !Array.isArray(db.budgets))
    for(const [ym,map] of Object.entries(db.budgets)){
      if(!/^\d{4}-\d{2}$/.test(ym) || !map || typeof map!=='object' || Array.isArray(map)) continue;
      const m2={};
      for(const [k,v] of Object.entries(map)){ const kk=sid(k); if(catIds.has(kk) && cents(v)>0) m2[kk]=cents(v); }
      if(Object.keys(m2).length) bClean[ym]=m2;
    }
  db.budgets=bClean;
  const u2={};
  if(db.usage && typeof db.usage==='object')
    for(const [k,v] of Object.entries(db.usage)){ const kk=sid(k); if(catIds.has(kk)) u2[kk]=Math.max(0,Math.round(+v)||0); }
  db.usage=u2;
  if(!db.accounts.some(a=>a.id===db.settings.lastAccount)) db.settings.lastAccount = db.accounts[0].id;
  return db;
}
let _saveT=null;
function save(){
  if(!storageOK) return;
  clearTimeout(_saveT);
  _saveT = setTimeout(()=>{
    try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
    catch(e){ storageOK=false; snack('No se pudo guardar en este navegador. Exporta un respaldo.', null, null, 8000); try{ render(); }catch(_){} }
  }, 250);
}
function flushSave(){
  if(!storageOK || !DB) return;
  clearTimeout(_saveT);
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){}
}
addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushSave(); });

/* ---------- Consultas básicas ---------- */
const cats = tipo => DB.cats.filter(c=>!c.archivada && (!tipo || c.tipo===tipo));
const cat = id => DB.cats.find(c=>c.id===id) || DB.cats.find(c=>c.id==='c_otros');
const account = id => DB.accounts.find(a=>a.id===id) || DB.accounts[0];
const activeAccounts = ()=> DB.accounts.filter(a=>!a.archivada);
const txOfMonth = ym => DB.tx.filter(t=>monthOf(t.fecha)===ym);
const inRange = (t,d1,d2) => t.fecha>=d1 && t.fecha<=d2;

function sumTipo(list, tipo){ return list.reduce((s,t)=>s+(t.tipo===tipo?t.monto:0),0); }
function gastosMes(ym){ return sumTipo(txOfMonth(ym),'g'); }
function ingresosMes(ym){ return sumTipo(txOfMonth(ym),'i'); }
function ingresosBase(list){
  return list.reduce((s,t)=>s+((t.tipo==='i' && cat(t.cat).grupo!=='excl')?t.monto:0),0);
}
function porCategoria(list, tipo='g'){
  const m = new Map();
  for(const t of list) if(t.tipo===tipo){ const id=cat(t.cat).id; m.set(id,(m.get(id)||0)+t.monto); }
  return [...m.entries()].map(([id,total])=>({cat:cat(id),total})).sort((a,b)=>b.total-a.total);
}
function accountBalance(id){
  let s = account(id).saldoInicial;
  for(const t of DB.tx){
    if(t.tipo==='g' && t.cuenta===id) s-=t.monto;
    else if(t.tipo==='i' && t.cuenta===id) s+=t.monto;
    else if(t.tipo==='t'){ if(t.cuenta===id) s-=t.monto; if(t.cuentaDestino===id) s+=t.monto; }
  }
  return s;
}
function totalBalance(){ return activeAccounts().reduce((s,a)=>s+accountBalance(a.id),0); }

/* acumulado diario de gastos de un mes → [{d,acum}] hasta 'hasta' (día) */
function acumuladoDiario(ym, hastaDia){
  const dim = daysInMonth(ym);
  const lim = Math.min(hastaDia||dim, dim);
  const perDay = new Array(dim+1).fill(0);
  for(const t of txOfMonth(ym)) if(t.tipo==='g') perDay[+t.fecha.slice(8,10)] += t.monto;
  const out=[]; let acc=0;
  for(let d=1; d<=lim; d++){ acc+=perDay[d]; out.push({d, acum:acc}); }
  return out;
}
/* serie mensual [{ym, ing, gas}] últimos n meses (incluye actual) */
function serieMensual(n){
  const out=[]; const cur=thisMonth();
  for(let i=n-1;i>=0;i--){ const ym=addMonths(cur,-i); out.push({ym, ing:ingresosMes(ym), gas:gastosMes(ym)}); }
  return out;
}

/* ---------- Presupuestos (con herencia mensual) ---------- */
function effectiveBudget(ym){
  if(DB.budgets[ym]) return {map:DB.budgets[ym], heredado:null};
  for(let i=1;i<=36;i++){
    const k = addMonths(ym,-i);
    if(DB.budgets[k]) return {map:DB.budgets[k], heredado:k};
  }
  return {map:{}, heredado:null};
}
function setBudget(ym, catId, cents){
  const eff = effectiveBudget(ym);
  if(!DB.budgets[ym]) DB.budgets[ym] = {...eff.map};
  if(cents>0) DB.budgets[ym][catId]=cents; else delete DB.budgets[ym][catId];
  DB.settings.budgetsTouched = true;
  save();
}
function budgetTotal(ym){ const {map}=effectiveBudget(ym); return Object.values(map).reduce((a,b)=>a+b,0); }
function gastoCat(ym, catId){ return txOfMonth(ym).reduce((s,t)=>s+((t.tipo==='g'&&t.cat===catId)?t.monto:0),0); }
/* redondeo amable para sugerencias */
function niceRound(cents){
  if(cents<=0) return 0;
  const v=cents/100;
  const mag = v>=100000?10000: v>=10000?1000: v>=1000?100: v>=100?10:1;
  return Math.ceil(v/mag)*mag*100;
}
function sugerirPresupuesto(ym){
  const prev3 = [1,2,3].map(i=>addMonths(ym,-i));
  const sug = {};
  for(const c of cats('g')){
    if(c.id==='c_ahorro') continue;
    const tot = prev3.reduce((s,m)=>s+gastoCat(m,c.id),0);
    const meses = prev3.filter(m=>txOfMonth(m).length>0).length || 1;
    const avg = tot/meses;
    if(avg>0) sug[c.id]=niceRound(avg);
  }
  return sug;
}

/* ---------- Insights ---------- */
function insightsMes(ym){
  const t = todayKey(); const esActual = ym===thisMonth();
  const dia = esActual ? +t.slice(8,10) : daysInMonth(ym);
  const dim = daysInMonth(ym);
  const gas = gastosMes(ym);
  const promDiario = dia>0 ? Math.round(gas/dia) : 0;
  const proy = esActual ? gas + promDiario*(dim-dia) : gas;
  const prevYm = addMonths(ym,-1);
  const prevAlDia = txOfMonth(prevYm).reduce((s,x)=>s+((x.tipo==='g'&&+x.fecha.slice(8,10)<=Math.min(dia,daysInMonth(prevYm)))?x.monto:0),0);
  const bt = budgetTotal(ym);
  const paraHoy = (esActual && bt>0) ? Math.max(0, Math.round((bt-gas)/Math.max(1,(dim-dia+1)))) : null;
  return {gas, promDiario, proy, prevAlDia, budget:bt, paraHoy, dia, dim};
}
function racha(){
  const dias = new Set(DB.tx.filter(t=>!t.demo && t.creado).map(t=>dateKey(new Date(t.creado))));
  let n=0; const d=new Date();
  if(!dias.has(dateKey(d))) d.setDate(d.getDate()-1);   /* la racha no se rompe hasta acabar el día */
  while(dias.has(dateKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---------- Movimientos ---------- */
function addTx({tipo, monto, cat:catId, cuenta, cuentaDestino, fecha, nota, metaId, fijoId, demo, auto}){
  const tx = {
    id:uid(), tipo, monto:Math.round(monto),
    cat: tipo==='t' ? null : (catId || (tipo==='g'?'c_otros':'i_reemb')),
    cuenta: cuenta || DB.settings.lastAccount || DB.accounts[0].id,
    fecha: fecha || todayKey(),
    nota: (nota||'').slice(0,140),
    creado: Date.now(),
  };
  if(tipo==='t') tx.cuentaDestino = cuentaDestino;
  if(metaId) tx.metaId = metaId;
  if(fijoId) tx.fijoId = fijoId;
  if(demo) tx.demo = true;
  DB.tx.push(tx);
  DB.tx.sort((a,b)=> a.fecha===b.fecha ? (a.creado-b.creado) : (a.fecha<b.fecha?-1:1));
  if(!auto){
    if(tx.cat) DB.usage[tx.cat]=(DB.usage[tx.cat]||0)+1;
    DB.settings.lastAccount = tx.cuenta;
  }
  save();
  return tx;
}
function updateTx(id, patch){
  const t = DB.tx.find(x=>x.id===id); if(!t) return;
  Object.assign(t, patch);
  DB.tx.sort((a,b)=> a.fecha===b.fecha ? ((a.creado||0)-(b.creado||0)) : (a.fecha<b.fecha?-1:1));
  save();
}
function deleteTx(id){
  const i = DB.tx.findIndex(x=>x.id===id); if(i<0) return null;
  const [t] = DB.tx.splice(i,1); save(); return t;
}
function restoreTx(t){ if(DB.tx.some(x=>x.id===t.id)) return; DB.tx.push(t); DB.tx.sort((a,b)=> a.fecha===b.fecha ? ((a.creado||0)-(b.creado||0)) : (a.fecha<b.fecha?-1:1)); save(); }

/* ---------- Fijos (recurrentes) ---------- */
function nextDueFrom(dia, fromKey){
  const from = parseKey(fromKey);
  const mk = `${from.getFullYear()}-${p2(from.getMonth()+1)}`;
  const dim = daysInMonth(mk);
  if(Math.min(dia,dim) > from.getDate()) return `${mk}-${p2(Math.min(dia,dim))}`;
  const nm = addMonths(mk,1);
  return `${nm}-${p2(Math.min(dia,daysInMonth(nm)))}`;
}
function postFijos(){
  const hoy = todayKey(); let n=0;
  for(const f of DB.fijos){
    if(!f.activo) continue;
    let guard=0;
    while(f.nextDue && f.nextDue<=hoy && guard++<60){
      addTx({tipo:f.tipo, monto:f.monto, cat:f.cat, cuenta:f.cuenta, fecha:f.nextDue, nota:f.nota, fijoId:f.id, demo:f.demo, auto:true});
      const after = addMonths(monthOf(f.nextDue),1);
      f.nextDue = `${after}-${p2(Math.min(f.dia,daysInMonth(after)))}`;
      n++;
    }
  }
  if(n>0){ save(); toast(`Se registraron ${n} movimiento${n>1?'s':''} fijo${n>1?'s':''} 🔁`); }
  return n;
}

/* ---------- Metas ---------- */
function metaProgreso(m){
  let s=0;
  for(const t of DB.tx) if(t.metaId===m.id) s += t.tipo==='g'? t.monto : -t.monto;
  return Math.max(0,s);
}
function metaAporteSugerido(m){
  if(!m.fechaLimite) return null;
  const falta = m.objetivo - metaProgreso(m);
  if(falta<=0) return 0;
  const hoy=parseKey(todayKey()), lim=parseKey(m.fechaLimite);
  const meses = Math.max(1, (lim.getFullYear()-hoy.getFullYear())*12 + (lim.getMonth()-hoy.getMonth()) + (lim.getDate()>=hoy.getDate()?0: -1) + 1);
  return Math.ceil(falta/meses);
}

/* ---------- Exportar / importar ---------- */
async function saveFile(filename, data, kind, reintento){
  if(window.claude?.downloads){
    try{
      await window.claude.downloads.save({filename, data});
      DB.settings.lastExport = Date.now(); save();
      toast('Respaldo guardado ✓');
      return;
    }catch(e){
      if(e?.code==='declined') return;
      if(e?.code==='extension_not_enabled' && !reintento){ return saveFile(filename+'.txt', data, kind, true); }
      if(e?.code==='rate_limited'){ toast('Espera un momento e intenta de nuevo.'); return; }
      /* cae al plan B con Blob */
    }
  }
  const blob = new Blob([data], {type: kind||'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
  DB.settings.lastExport = Date.now(); save();
}
function exportJSON(){
  const data = JSON.stringify({app:'cuentas-claras', exportado:new Date().toISOString(), db:DB}, null, 1);
  saveFile(`cuentas-claras-respaldo-${todayKey()}.json`, data, 'application/json');
}
function exportCSV(){
  const sep = decSep()===',' ? ';' : ',';
  const rows=[['fecha','tipo','categoria','cuenta','cuenta_destino','nota','monto','moneda','id']];
  for(const t of [...DB.tx].sort((a,b)=>a.fecha<b.fecha?-1:1)){
    const tipo = t.tipo==='g'?'gasto':t.tipo==='i'?'ingreso':'transferencia';
    const catN = t.tipo==='t' ? 'Transferencia' : cat(t.cat).nombre;
    const monto = plainNum(t.tipo==='g' ? -t.monto : t.monto);
    rows.push([t.fecha, tipo, catN, account(t.cuenta).nombre, t.tipo==='t'?account(t.cuentaDestino).nombre:'', t.nota||'', monto, DB.settings.currency, t.id]);
  }
  const csv = '\uFEFF'+rows.map(r=>r.map(c=>{ c=String(c); return (c.includes(sep)||c.includes('"')||c.includes('\n')) ? '"'+c.replace(/"/g,'""')+'"' : c; }).join(sep)).join('\r\n');
  saveFile(`cuentas-claras-movimientos-${todayKey()}.csv`, csv, 'text/csv');
}
function importJSON(file, modo){
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const obj = JSON.parse(rd.result);
      const db = obj.db || obj;
      if(!Array.isArray(db.tx) || !db.settings) throw new Error('formato');
      if(modo==='replace'){
        DB = migrate(db);
      }else{
        if(db.settings?.currency && DB.settings.currency && db.settings.currency!==DB.settings.currency){
          toast(`El respaldo está en ${db.settings.currency} y tus datos en ${DB.settings.currency}. Usa «Reemplazar» para no mezclar monedas.`);
          return;
        }
        const ids = new Set(DB.tx.map(t=>t.id));
        for(const t of db.tx) if(!ids.has(t.id)) DB.tx.push(t);
        for(const c of db.cats||[]) if(!DB.cats.some(x=>x.id===c.id)) DB.cats.push(c);
        for(const a of db.accounts||[]) if(!DB.accounts.some(x=>x.id===a.id)) DB.accounts.push(a);
        for(const m of db.metas||[]) if(!DB.metas.some(x=>x.id===m.id)) DB.metas.push(m);
        for(const f of db.fijos||[]) if(!DB.fijos.some(x=>x.id===f.id)) DB.fijos.push(f);
        for(const [ym,map] of Object.entries(db.budgets||{})) if(!DB.budgets[ym]) DB.budgets[ym]=map;
        DB = migrate(DB);
      }
      save(); render();
      toast('Datos importados ✓');
    }catch(e){ toast('El archivo no es un respaldo válido de Cuentas Claras.'); }
  };
  rd.readAsText(file);
}

/* ---------- Datos de ejemplo ---------- */
function mulberry(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function cargarDemo(){
  if(DB.tx.some(t=>t.demo)) return;
  const R = mulberry(20260803);
  const hoyD = parseKey(todayKey());
  const K = curDecimals()===0 ? 10000 : 100;          /* magnitudes razonables por moneda */

      if(R()<.7) push(y,mo,5+w*7,'g',(4+R()*9)*K,'c_trans',['Bus','Gasolina','Taxi'][Math.floor(R()*3)]);
      if(R()<.4) push(y,mo,6+w*7,'g',(10+R()*25)*K,'c_ocio',['Cine','Concierto','Videojuego'][Math.floor(R()*3)]);
    }
    if(R()<.6) push(y,mo,15,'g',(20+R()*45)*K,'c_ropa','Compras');
    if(R()<.5) push(y,mo,18,'g',(15+R()*30)*K,'c_salud','Farmacia');
    if(R()<.35) push(y,mo,21,'g',(15+R()*30)*K,'c_regalo','Regalo cumpleaños');
  }
  const meta = {id:uid(), nombre:'Vacaciones', emoji:'🏖️', objetivo:1200*K, fechaLimite:addMonths(thisMonth(),5)+'-15', creado:Date.now(), demo:true};
  DB.metas.push(meta);
  { const [y1,m1]=meses[1], [y2,m2]=meses[2];
    const a1=push(y1,m1,3,'g',150*K,'c_ahorro','Abono meta'); if(a1) a1.metaId=meta.id;
    const a2=push(y2,m2,3,'g',150*K,'c_ahorro','Abono meta'); if(a2) a2.metaId=meta.id; }
  if(Object.keys(DB.budgets).length===0){
    DB.budgets[thisMonth()] = {c_super:280*K, c_rest:120*K, c_trans:60*K, c_hogar:500*K, c_serv:110*K, c_subs:20*K, c_ocio:80*K, c_ropa:60*K, c_salud:60*K};

  if(!DB.fijos.some(f=>f.demo)){

  }
  save();
}

/* ---------- Snackbar / toast / undo ---------- */
function snack(msg, actionLabel, fn, ms=6000){
  const wrap = $('#snackwrap');
  const el = document.createElement('div');
  el.className='snack';
  const span = document.createElement('span'); span.textContent = msg; el.appendChild(span);
  if(actionLabel){
    const b=document.createElement('button'); b.textContent=actionLabel;
    b.onclick=()=>{ fn&&fn(); kill(); };
    el.appendChild(b);
  }
  wrap.appendChild(el);
  const kill=()=>{ el.classList.add('bye'); setTimeout(()=>el.remove(),220); };
  setTimeout(kill, ms);
}
const toast = m => snack(m, null, null, 3200);

/* ============================================================
   Tooltip único (hover + foco de teclado)
   ============================================================ */
const tip = $('#tip');
function tipShow(x, y, title, rows){
  tip.textContent='';
  if(title){ const t=document.createElement('div'); t.className='t-t'; t.textContent=title; tip.appendChild(t); }
  for(const r of rows){
    const d=document.createElement('div'); d.className='t-r';
    if(r.color){ const k=document.createElement('i'); k.className='k'; k.style.background=r.color; d.appendChild(k); }
    const v=document.createElement('span'); v.className='v'; v.textContent=r.v; d.appendChild(v);
    if(r.l){ const l=document.createElement('span'); l.className='l'; l.textContent=r.l; d.appendChild(l); }
    tip.appendChild(d);
  }
  tip.classList.add('on');
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let tx = x+14, ty = y-h-12;
  if(tx+w > innerWidth-8) tx = x-w-14;
  if(tx<8) tx=8;
  if(ty<8) ty = y+18;
  tip.style.left = tx+'px'; tip.style.top = ty+'px';
}
function tipHide(){ tip.classList.remove('on'); }
addEventListener('scroll', tipHide, {passive:true, capture:true});

/* util svg */
const NS='http://www.w3.org/2000/svg';
function sv(tag, attrs, parent){
  const el=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='text'){ el.textContent=v; }
    else if(k==='style'){ el.setAttribute('style',v); }
    else el.setAttribute(k,v);
  }
  if(parent) parent.appendChild(el);
  return el;
}
function niceMax(v){
  if(v<=0) return 100;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if(m*p>=v) return m*p;
  return 10*p;
}
/* foco accesible en marcas */
function markFocusable(el, label, onShow){
  el.setAttribute('tabindex','0');
  el.setAttribute('role','img');
  el.setAttribute('aria-label', label);
  el.addEventListener('focus', ()=>{ const r=el.getBoundingClientRect(); onShow(r.left+r.width/2, r.top); });
  el.addEventListener('blur', tipHide);
}

/* ============================================================
   Dona: gastos por categoría (top 6 + Otros)
   ============================================================ */
function donutChart(items, total, onPick){
  const box=document.createElement('div'); box.className='donut-c';
  const svg=sv('svg',{viewBox:'0 0 200 200',class:'donut-svg','aria-hidden':'false'});
  const cx=100, cy=100, R=78, r=52;
  const arc=(a0,a1,color,seg)=>{
    const big = (a1-a0)>Math.PI ? 1:0;
    const x0=cx+R*Math.sin(a0), y0=cy-R*Math.cos(a0);
    const x1=cx+R*Math.sin(a1), y1=cy-R*Math.cos(a1);
    const xi=cx+r*Math.sin(a1), yi=cy-r*Math.cos(a1);
    const xj=cx+r*Math.sin(a0), yj=cy-r*Math.cos(a0);
    const p=sv('path',{
      d:`M${x0} ${y0} A${R} ${R} 0 ${big} 1 ${x1} ${y1} L${xi} ${yi} A${r} ${r} 0 ${big} 0 ${xj} ${yj} Z`,
      class:'seg-arc', style:`fill:${seg.color};stroke:var(--surface);stroke-width:2;stroke-linejoin:round`
    },svg);
    return p;
  };
  let a=0;
  for(const seg of items){
    const frac = seg.total/total;
    const a1 = a + frac*2*Math.PI;
    let p;
    if(items.length===1){
      p=sv('g',{},svg);
      sv('circle',{cx,cy,r:(R+r)/2,fill:'none',stroke:seg.color,'stroke-width':R-r},p);
    }else{
      p=arc(a, Math.max(a1, a+0.02), seg, seg);
    }
    const show=(x,y)=> tipShow(x,y, seg.nombre, [{v:fmtMoney(seg.total), l:Math.round(frac*100)+'%', color:seg.color}]);
    p.addEventListener('pointermove', e=>show(e.clientX,e.clientY));
    p.addEventListener('pointerleave', tipHide);
    p.addEventListener('click', ()=>{ tipHide(); onPick && onPick(seg); });
    markFocusable(p, `${seg.nombre}: ${fmtMoney(seg.total)}, ${Math.round(frac*100)}%`, show);
    a=a1;
  }
  sv('text',{x:cx,y:cy-8,'text-anchor':'middle',class:'dc-lbl',text:'Total gastos'},svg);
  sv('text',{x:cx,y:cy+13,'text-anchor':'middle',class:'dc-val num',text:fmtCompact(total)},svg);
  box.appendChild(svg);
  const ley=document.createElement('div'); ley.className='leyenda-cat';
  for(const seg of items){
    const b=document.createElement('button'); b.className='lcat';
    b.innerHTML=`<i class="sw" style="background:${seg.color}"></i><span class="nm">${seg.emoji?seg.emoji+' ':''}${esc(seg.nombre)}</span><span class="pc num">${Math.round(seg.total/total*100)}%</span><span class="mt num">${fmtMoney(seg.total)}</span>`;
    b.onclick=()=> onPick && onPick(seg);
    ley.appendChild(b);
  }
  box.appendChild(ley);
  return box;
}

/* ============================================================
   Columnas agrupadas: ingresos vs gastos por mes
   ============================================================ */
function columnsChart(serie){
  const W=560, H=210, padL=44, padR=8, padT=12, padB=26;
  const wrap=document.createElement('div'); wrap.className='chart-wrap';
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`});
  const max = niceMax(Math.max(1,...serie.map(s=>Math.max(s.ing,s.gas)))/100)*100;
  const iw = (W-padL-padR)/serie.length;
  const y = v => padT + (H-padT-padB) * (1 - v/max);
  for(const f of [0,.5,1]){
    const yy=y(max*f);
    sv('line',{x1:padL,x2:W-padR,y1:yy,y2:yy,class:f===0?'baseline':'gridline'},svg);
    sv('text',{x:padL-6,y:yy+3.5,'text-anchor':'end',class:'axis num',text:fmtCompact(max*f)},svg);
  }
  const bw = Math.min(24, iw/2-6);
  const rTop=4;
  const bar=(x,v,color)=>{
    const hh=Math.max(0,y(0)-y(v));
    const rr=Math.min(rTop,hh);
    return sv('path',{d:`M${x} ${y(0)} v${-(hh-rr)} q0 ${-rr} ${rr} ${-rr} h${bw-2*rr} q${rr} 0 ${rr} ${rr} v${hh-rr} Z`,
      class:'bar', style:`fill:${color}`},svg);
  };
  serie.forEach((s,i)=>{
    const cxx = padL + iw*i + iw/2;
    const b1 = s.ing>0 ? bar(cxx-bw-1, s.ing, 'var(--ing)') : null;
    const b2 = s.gas>0 ? bar(cxx+1, s.gas, 'var(--gas)') : null;
    sv('text',{x:cxx,y:H-8,'text-anchor':'middle',class:'axis',text:monthLabel(s.ym,true)},svg);
    const hit=sv('rect',{x:padL+iw*i,y:padT,width:iw,height:H-padT-padB,fill:'transparent',class:'bar'},svg);
    const show=(x,yy)=> tipShow(x,yy, monthLabel(s.ym), [
      {v:fmtMoney(s.ing), l:'ingresos', color:getComputedStyle(document.documentElement).getPropertyValue('--ing')},
      {v:fmtMoney(s.gas), l:'gastos', color:getComputedStyle(document.documentElement).getPropertyValue('--gas')},
      {v:fmtMoney(s.ing-s.gas,{}), l:'balance'},
    ]);
    hit.addEventListener('pointermove', e=>show(e.clientX,e.clientY));
    hit.addEventListener('pointerleave', tipHide);
    markFocusable(hit, `${monthLabel(s.ym)}: ingresos ${fmtMoney(s.ing)}, gastos ${fmtMoney(s.gas)}`, show);
  });
  wrap.appendChild(svg);
  const ley=document.createElement('div'); ley.className='legend';
  ley.innerHTML=`<span class="lg"><i class="sw" style="--lc:var(--ing)"></i>Ingresos</span>
                 <span class="lg"><i class="sw" style="--lc:var(--gas)"></i>Gastos</span>`;
  wrap.appendChild(ley);

/* ============================================================
   Línea de ritmo: acumulado del mes vs mes anterior
   ============================================================ */
function ritmoChart(ym){
  const wrap=document.createElement('div'); wrap.className='chart-wrap';
  const W=560,H=200,padL=44,padR=14,padT=14,padB=24;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`});
  const dim=daysInMonth(ym);
  const esActual = ym===thisMonth();
  const hoy = esActual? +todayKey().slice(8,10) : dim;
  const cur = acumuladoDiario(ym, hoy);
  const prevYm = addMonths(ym,-1);
  const prev = acumuladoDiario(prevYm, daysInMonth(prevYm));
  const dimX = Math.max(dim, prev.length? daysInMonth(prevYm) : 0);
  const max = niceMax(Math.max(1, cur.at(-1)?.acum||0, prev.at(-1)?.acum||0)/100)*100;
  const x = d => padL + (W-padL-padR)*(d-1)/(dimX-1);
  const y = v => padT + (H-padT-padB)*(1-v/max);
  for(const f of [0,.5,1]){
    const yy=y(max*f);
    sv('line',{x1:padL,x2:W-padR,y1:yy,y2:yy,class:f===0?'baseline':'gridline'},svg);
    sv('text',{x:padL-6,y:yy+3.5,'text-anchor':'end',class:'axis num',text:fmtCompact(max*f)},svg);
  }
  for(const d of [1,7,14,21,dimX]) sv('text',{x:x(d),y:H-6,'text-anchor':'middle',class:'axis num',text:d},svg);
  const path = pts => pts.map((p,i)=>`${i?'L':'M'}${x(p.d).toFixed(1)} ${y(p.acum).toFixed(1)}`).join(' ');
  if(prev.length>1) sv('path',{d:path(prev),fill:'none',stroke:'var(--muted)','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.55},svg);
  if(cur.length){
    sv('path',{d:path(cur)+` L${x(cur.at(-1).d)} ${y(0)} L${x(1)} ${y(0)} Z`,fill:'var(--linea-mes)',opacity:.10},svg);
    sv('path',{d:path(cur),fill:'none',stroke:'var(--linea-mes)','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'},svg);
    const last=cur.at(-1);
    sv('circle',{cx:x(last.d),cy:y(last.acum),r:5,fill:'var(--linea-mes)',stroke:'var(--surface)','stroke-width':2},svg);
  }
  /* crosshair */
  const cross=sv('line',{x1:0,x2:0,y1:padT,y2:H-padB,stroke:'var(--grid)','stroke-width':1,opacity:0},svg);
  const hit=sv('rect',{x:padL,y:padT,width:W-padL-padR,height:H-padT-padB,fill:'transparent'},svg);
  const pv = getComputedStyle(document.documentElement);
  const showAt=(d, cx, cy)=>{
    cross.setAttribute('x1',x(d)); cross.setAttribute('x2',x(d)); cross.setAttribute('opacity',1);
    const rows=[];
    const c1=cur.find(p=>p.d===d), c0=prev.find(p=>p.d===d);
    if(c1) rows.push({v:fmtMoney(c1.acum), l:'este mes', color:pv.getPropertyValue('--linea-mes')});
    if(c0) rows.push({v:fmtMoney(c0.acum), l:'mes anterior', color:pv.getPropertyValue('--muted')});
    tipShow(cx, cy, `Día ${d}`, rows);
  };
  hit.addEventListener('pointermove', e=>{
    const rect=svg.getBoundingClientRect();
    const px=(e.clientX-rect.left)*(W/rect.width);
    const d=Math.max(1,Math.min(dimX,Math.round(1+(px-padL)/((W-padL-padR)/(dimX-1)))));
    showAt(d, e.clientX, e.clientY);
  });
  hit.addEventListener('pointerleave', ()=>{ cross.setAttribute('opacity',0); tipHide(); });
  markFocusable(hit, `Gasto acumulado de ${monthLabel(ym)}: ${fmtMoney(cur.at(-1)?.acum||0)}${prev.length?`, mes anterior ${fmtMoney(prev.at(-1)?.acum||0)}`:''}`,
    (cx,cy)=>showAt(hoy,cx,cy));
  wrap.appendChild(svg);
  const ley=document.createElement('div'); ley.className='legend';
  ley.innerHTML=`<span class="lg"><i class="ln" style="--lc:var(--linea-mes)"></i>Este mes</span>
                 <span class="lg"><i class="ln" style="--lc:var(--muted)"></i>Mes anterior</span>`;
  wrap.appendChild(ley);
  return wrap;
}

/* ============================================================
   Calendario de calor del mes (secuencial)
   ============================================================ */
function heatmapChart(ym){
  const wrap=document.createElement('div'); wrap.className='chart-wrap';
  const dim=daysInMonth(ym);
  const perDay=new Array(dim+1).fill(0);
  for(const t of txOfMonth(ym)) if(t.tipo==='g') perDay[+t.fecha.slice(8,10)]+=t.monto;
  const vals=perDay.filter(v=>v>0).sort((a,b)=>a-b);
  const q = f => vals.length? vals[Math.min(vals.length-1, Math.floor(f*vals.length))] : 0;
  const steps=[q(.18),q(.36),q(.54),q(.72),q(.9)];
  const colorOf = v => v<=0 ? 'var(--surface2)' :
    v<=steps[0]?'var(--sq1)': v<=steps[1]?'var(--sq2)': v<=steps[2]?'var(--sq3)': v<=steps[3]?'var(--sq4)': v<=steps[4]?'var(--sq5)':'var(--sq6)';
  const first=parseKey(ym+'-01');
  const off=(first.getDay()+6)%7; /* lunes=0 */
  const rows=Math.ceil((off+dim)/7);
  const CS=30,G=4,padT=18;
  const W=7*CS+6*G, H=padT+rows*CS+(rows-1)*G;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,style:'max-width:320px;margin:0 auto'});
  ['L','M','X','J','V','S','D'].forEach((d,i)=> sv('text',{x:i*(CS+G)+CS/2,y:11,'text-anchor':'middle',class:'axis',text:d},svg));
  for(let d=1;d<=dim;d++){
    const idx=off+d-1, col=idx%7, row=Math.floor(idx/7);
    const v=perDay[d];
    const cell=sv('rect',{x:col*(CS+G),y:padT+row*(CS+G),width:CS,height:CS,rx:7,class:'hm-cell',
      style:`fill:${colorOf(v)}`},svg);
    const lum = v>0 && (v>steps[2]);
    sv('text',{x:col*(CS+G)+CS/2,y:padT+row*(CS+G)+CS/2+3.5,'text-anchor':'middle',
      style:`font-size:10px;font-weight:600;pointer-events:none;fill:${v<=0?'var(--muted)':lum?'var(--bg)':'var(--ink2)'}`,text:d},svg);
    const dk=`${ym}-${p2(d)}`;
    const show=(x,y)=> tipShow(x,y, dayLabel(dk), [{v:fmtMoney(v), l:'gastado'}]);
    cell.addEventListener('pointermove',e=>show(e.clientX,e.clientY));
    cell.addEventListener('pointerleave',tipHide);
    markFocusable(cell, `${dayLabel(dk)}: ${fmtMoney(v)}`, show);
  }
  wrap.appendChild(svg);
  return wrap;
}

/* ============================================================
   Barra apilada 50/30/20
   ============================================================ */
function stack503020(ym){
  const ing = ingresosBase(txOfMonth(ym));
  const grupos={nec:0,des:0,aho:0};
  for(const t of txOfMonth(ym)) if(t.tipo==='g'){ const g=cat(t.cat).grupo; if(grupos[g]!=null) grupos[g]+=t.monto; else grupos.des+=t.monto; }
  const escala = Math.max(ing, grupos.nec+grupos.des+grupos.aho);
  const box=document.createElement('div');
  if(ing<=0){
    box.innerHTML=`<p class="card-sub">Registra tus ingresos del mes para ver la regla 50/30/20.</p>`;
    return box;
  }
  const defs=[
    {k:'nec', n:'Necesidades', meta:50, color:'var(--c0)'},
    {k:'des', n:'Deseos',      meta:30, color:'var(--c4)'},
    {k:'aho', n:'Ahorro',      meta:20, color:'var(--c5)'},
  ];
  const bar=document.createElement('div');
  bar.style.cssText='display:flex;height:16px;border-radius:999px;overflow:hidden;gap:2px;background:var(--surface2)';
  for(const d of defs){
    const pc=grupos[d.k]/escala*100;
    if(pc<=0) continue;
    const i=document.createElement('i');
    i.style.cssText=`display:block;height:100%;flex:0 0 ${pc}%;background:${d.color}`;
    i.title=`${d.n}: ${Math.round(pc)}%`;
    bar.appendChild(i);
  }
  box.appendChild(bar);
  const list=document.createElement('div'); list.style.marginTop='10px';
  for(const d of defs){
    const pc=Math.round(grupos[d.k]/ing*100);
    const diff=pc-d.meta;
    const est = d.k==='aho'
      ? (diff>=0?['al día','var(--good)']:['por debajo','var(--muted)'])
      : (diff<=0?['dentro de la meta','var(--good)']:['+'+diff+' pts sobre la meta','var(--crit-text)']);
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:13px';
    row.innerHTML=`<i class="sw" style="width:10px;height:10px;border-radius:3px;background:${d.color};flex:none"></i>
      <span style="font-weight:650">${d.n}</span>
      <span class="card-sub">meta ${d.meta}%</span>
      <span class="sp"></span>
      <b class="num">${pc}%</b>
      <span style="font-size:12px;font-weight:600;color:${est[1]}">${est[0]}</span>`;
    list.appendChild(row);
  }
  box.appendChild(list);
  box.insertAdjacentHTML('beforeend',`<p class="card-sub" style="margin-top:8px">Sobre ingresos de ${fmtMoney(ing)} este mes. El abono a metas cuenta como ahorro.</p>`);
  return box;
}

function chartCard({title, sub, chartEl, table, extraHead}){
  const c=document.createElement('section'); c.className='card';

  head.innerHTML=`<div><div class="card-title">${esc(title)}</div>${sub?`<div class="card-sub">${esc(sub)}</div>`:''}</div><span class="sp"></span>`;
  if(extraHead) head.appendChild(extraHead);
  let tbtn=null, showing=false, tblEl=null;
  if(table){
    tbtn=document.createElement('button');
    tbtn.className='iconbtn'; tbtn.style.cssText='width:32px;height:32px';
    tbtn.setAttribute('aria-label','Ver como tabla'); tbtn.setAttribute('aria-pressed','false');
    tbtn.innerHTML=ICONS.table;
    head.appendChild(tbtn);
  }
  c.appendChild(head);
  const body=document.createElement('div');
  body.appendChild(chartEl);
  c.appendChild(body);
  if(table){
    tbtn.onclick=()=>{
      showing=!showing;
      tbtn.setAttribute('aria-pressed', String(showing));
      if(showing){
        if(!tblEl){
          tblEl=document.createElement('div'); tblEl.className='tbl-scroll';
          const t=document.createElement('table'); t.className='tbl';
          t.innerHTML=`<thead><tr>${table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>

          tblEl.appendChild(t);
        }
        body.replaceChildren(tblEl);
      }else body.replaceChildren(chartEl);
    };
  }
  return c;
}

/* ============================================================
   Sheet genérico
   ============================================================ */
const sheet=$('#sheet'), backdrop=$('#backdrop');
let sheetOpen=false, onSheetClose=null, sheetTrigger=null;
function openSheet(build){
  if(sheetOpen){ onSheetClose && onSheetClose(); onSheetClose=null; }
  sheetTrigger=document.activeElement;
  sheet.textContent='';
  sheet.insertAdjacentHTML('beforeend','<div class="grab"></div>');
  build(sheet);
  sheet.classList.add('on'); backdrop.classList.add('on');
  sheetOpen=true;
  document.body.style.overflow='hidden';
  const app=$('#app'); if(app) app.inert=true;
  const f=sheet.querySelector('[autofocus]');
  setTimeout(()=>{ (f||sheet).focus(); },90);
}
function closeSheet(){
  if(!sheetOpen) return;
  sheet.classList.remove('on'); backdrop.classList.remove('on');
  sheetOpen=false;
  document.body.style.overflow='';
  const app=$('#app'); if(app) app.inert=false;
  onSheetClose && onSheetClose(); onSheetClose=null;
  setTimeout(()=>{ if(!sheetOpen) sheet.textContent=''; }, 320);
  if(sheetTrigger && document.contains(sheetTrigger)) sheetTrigger.focus();
  sheetTrigger=null;
}
backdrop.addEventListener('click', closeSheet);
addEventListener('keydown', e=>{ if(e.key==='Escape' && sheetOpen) closeSheet(); });
/* trampa de foco dentro del sheet */
sheet.addEventListener('keydown', e=>{
  if(e.key!=='Tab' || !sheetOpen) return;
  const f=[...sheet.querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(x=>x.offsetParent!==null);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && (document.activeElement===first||document.activeElement===sheet)){ last.focus(); e.preventDefault(); }
  else if(!e.shiftKey && document.activeElement===last){ first.focus(); e.preventDefault(); }
});
function sheetHead(el, title, extra){
  sheet.setAttribute('aria-label', title);
  const h=document.createElement('div'); h.className='sh-head';
  h.innerHTML=`<span class="sh-title">${esc(title)}</span><span class="sp"></span>`;
  if(extra) h.appendChild(extra);
  const x=document.createElement('button'); x.className='iconbtn'; x.setAttribute('aria-label','Cerrar'); x.innerHTML=ICONS.x;
  x.onclick=closeSheet; h.appendChild(x);
  el.appendChild(h);
  return h;
}

/* ============================================================
   Teclado calculadora
   ============================================================ */
function makeKeypad(displayEl, hintEl, onChange){
  const st={ tokens:[], cur:'' };  /* tokens: [num,'+',num,...] ; cur = número en edición */
  const dsep=decSep()||',';
  const dec=curDecimals();
  const fmtEntry = s=>{
    if(s==='') return '0';
    const [i,f]=s.split('.');
    const gi=(+i||0).toLocaleString(curLocale(DB.settings.currency),{maximumFractionDigits:0});
    return f!=null? gi+dsep+f : gi;
  };
  const evalTokens=()=>{
    const seq=[...st.tokens]; if(st.cur!=='') seq.push(st.cur);
    if(!seq.length) return 0;
    if(typeof seq.at(-1)==='string' && isNaN(+seq.at(-1))) seq.pop();
    /* × primero */
    let vals=[+seq[0]||0], ops=[];
    for(let i=1;i<seq.length;i+=2){
      const op=seq[i], n=+seq[i+1]||0;
      if(op==='×') vals[vals.length-1]*=n;
      else { ops.push(op); vals.push(n); }
    }
    let r=vals[0];
    ops.forEach((op,i)=>{ r = op==='+' ? r+vals[i+1] : r-vals[i+1]; });
    return Math.max(0,r);
  };
  const cents=()=> Math.round(evalTokens()*100);
  const paint=()=>{
    const hasExpr=st.tokens.length>0;
    displayEl.classList.toggle('expr',hasExpr);
    let html=`<span class="cur">${esc(currencySymbol())}</span>`;
    for(const t of st.tokens){
      if(t==='+'||t==='−'||t==='×') html+=`<span class="op">${t}</span>`;
      else html+=`<span class="num">${esc(fmtEntry(t))}</span>`;
    }
    html+=`<span class="num">${esc(fmtEntry(st.cur))}</span>`;
    displayEl.innerHTML=html;
    hintEl.textContent = hasExpr ? `= ${fmtMoney(cents())}` : '';
    onChange && onChange(cents());
  };
  const press=k=>{
    if(k>='0'&&k<='9'){
      const [i,f]=st.cur.split('.');
      if(f!=null){ if(f.length>=dec) return; st.cur+=k; }
      else{ if((i||'').replace(/^0+/,'').length>=9) return; st.cur = (st.cur==='0'?'':st.cur)+k; }
    }
    else if(k==='sep'){ if(dec===0) return; if(!st.cur.includes('.')) st.cur=(st.cur||'0')+'.'; }
    else if(k==='+'||k==='−'||k==='×'){
      if(st.cur===''){ if(st.tokens.length) st.tokens[st.tokens.length-1]=k; return paint(); }
      st.tokens.push(st.cur,k); st.cur='';
    }
    else if(k==='back'){
      if(st.cur!=='') st.cur=st.cur.slice(0,-1);
      else if(st.tokens.length){ st.tokens.pop(); st.cur=st.tokens.pop()||''; }
    }
    else if(k==='eq'){ const c=cents(); st.tokens=[]; st.cur = c? String(c/100):''; }
    paint();
  };
  const pad=document.createElement('div'); pad.className='keypad';
  const keys=[ '7','8','9','+','4','5','6','−','1','2','3','×','sep','0','back','eq' ];
  for(const k of keys){
    const b=document.createElement('button'); b.className='key';
    b.dataset.k=k;
    if(k==='sep'){ b.textContent=dsep; if(dec===0){ b.style.opacity='.25'; } }
    else if(k==='back'){ b.innerHTML=ICONS.backsp; b.setAttribute('aria-label','Borrar'); }
    else if(k==='eq'){ b.textContent='='; b.className='key op'; }
    else if('+−×'.includes(k)) { b.textContent=k; b.className='key op'; }
    else b.textContent=k;
    b.addEventListener('click',()=>press(k));
    pad.appendChild(b);
  }
  const keyHandler=e=>{
    if(!sheetOpen) return;
    const t=e.target;
    if(t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;           /* no secuestrar la nota/fecha */
    if(e.key==='Enter' && document.activeElement?.tagName==='BUTTON') return; /* Enter activa el botón enfocado */
    if(e.key>='0'&&e.key<='9') press(e.key);
    else if(e.key===','||e.key==='.') press('sep');
    else if(e.key==='+') press('+');
    else if(e.key==='-') press('−');
    else if(e.key==='*'||e.key==='x') press('×');
    else if(e.key==='Backspace') press('back');
    else if(e.key==='='||e.key==='Enter') press('eq');
    else return;
    e.preventDefault();
  };
  addEventListener('keydown', keyHandler);
  onSheetClose=(prev=>()=>{ removeEventListener('keydown',keyHandler); prev&&prev(); })(onSheetClose);
  paint();
  return { pad, cents, set(c){ st.tokens=[]; st.cur = c>0? (c/100).toFixed(dec):''; paint(); } };
}

function parseMoneyInput(str){
  const neg = /^\s*-/.test(String(str||''));
  let s=String(str||'').trim().replace(/[^\d.,]/g,'');
  if(!s) return 0;
  const lastC=s.lastIndexOf(','), lastD=s.lastIndexOf('.');
  let dec='';
  if(lastC>=0 && lastD>=0){ const p=Math.max(lastC,lastD); dec=s.slice(p+1); s=s.slice(0,p); }
  else if(lastC>=0 || lastD>=0){
    const p=Math.max(lastC,lastD); const after=s.slice(p+1);
    if(after.length<=2 && curDecimals()>0){ dec=after; s=s.slice(0,p); }
  }
  s=s.replace(/[.,]/g,'');
  const v=(+s||0) + (dec? (+dec.padEnd(2,'0').slice(0,2))/100 : 0);
  return Math.round(v*100) * (neg?-1:1);
}
function moneyInput(id, placeholder, valueCents){

}

        addTx({tipo:st.tipo, monto:c, cat:st.cat, cuenta:st.cuenta, cuentaDestino:st.cuentaDestino, fecha:st.fecha, nota:st.nota});

          closeSheet(); render(); toast('Movimiento duplicado ✓');
        };

        sv.onclick=trySave;
        actions.append(del,dup,document.createElement('span'),sv);

        const sv=document.createElement('button'); sv.className='btn'; sv.id='btnSaveMov'; sv.style.flex='1'; sv.textContent='Transferir';
        sv.onclick=trySave;
        actions.appendChild(sv);
      }
      paintSaveState(kp.cents());
    }

    setTipo(st.tipo);
    paintFecha();
    if(edit && st.tipo!=='t'){ /* marcar la categoría actual */ }
  });

/* confetti */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas');
  cv.style.cssText='position:fixed;inset:0;z-index:95;pointer-events:none';
  cv.width=innerWidth; cv.height=innerHeight; document.body.appendChild(cv);
  const ctx=cv.getContext('2d');
  const colors=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#4a3aa7','#c2417f'];
  const P=[...Array(80)].map(()=>({x:innerWidth/2+(Math.random()-.5)*160, y:innerHeight*.35, vx:(Math.random()-.5)*9, vy:-4-Math.random()*7, r:3+Math.random()*4, c:colors[Math.floor(Math.random()*colors.length)], a:Math.random()*Math.PI}));
  let t0=performance.now();
  (function tick(now){
    const dt=(now-t0)/1000;
    ctx.clearRect(0,0,cv.width,cv.height);
    for(const p of P){
      p.x+=p.vx; p.y+=p.vy; p.vy+=.25; p.a+=.15;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
      ctx.fillStyle=p.c; ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);
      ctx.restore();
    }
    if(dt<1.6) requestAnimationFrame(tick); else cv.remove();
  })(t0);
}
